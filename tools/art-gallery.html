<!doctype html><meta charset="utf-8"><title>Galerie bestiaire</title>
<body style="margin:0;background:#1b1330;color:#eee;font:12px sans-serif"><canvas id="c"></canvas>
<script src="../js/arcane-core.js"></script><script src="../js/arcane-art.js"></script><script src="../js/arcane-bestiary.js"></script><script src="../js/arcane-gfx.js"></script><script src="../js/arcane-beasts.js"></script>
<script>
var ids=["traqueur","colosse","spectre","tisseur","siphonneur","araignee","araignelet","reinetisse","chatmasque"],c=document.getElementById("c"),g=c.getContext("2d"),S=2;
c.width=ids.length*200*1;c.height=2*260*1;c.style.width=c.width+"px";
function draw(t){g.clearRect(0,0,c.width,c.height);g.fillStyle="#2a2040";g.fillRect(0,0,c.width,c.height);
 [0,1].forEach(function(row){ids.forEach(function(id,i){var x=i*200+100,y=row*260+190;g.fillStyle="#3a2d5a";g.beginPath();g.ellipse(x,y,70,26,0,0,7);g.fill();
  var M=AT_CORE.MOBS[id]||{};AT_ART.mob(g,id,x,y,{t:t,col:M.col,scale:1.5,elite:row==1,cast:row==1?(Math.sin(t*2)*.5+.5):0,walk:row==0?(t*.8)%1:null});
  g.fillStyle="#fff";g.fillText(id+(row?" (élite+cast)":""),x-40,row*260+240);});});}
function loop(t){draw(t/1000);requestAnimationFrame(loop)} loop(0);
</script></body>
