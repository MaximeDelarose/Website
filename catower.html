  e.hp -= dmg; e.flash = 1;

// ---------------- Croquettes / XP ----------------
function drop(x, z, cro, xp, big) {
  let c = cro;
  if (big && c > 0) { const b = Math.round(c * .6); mkPick('c', b, x, z, 1.8); c -= b; }
  if (c > 0) { const n = Math.max(1, Math.min(big ? 5 : 4, Math.ceil(c / 5))); for (let i = 0; i < n; i++) mkPick('c', i === n - 1 ? c - Math.floor(c / n) * (n - 1) : Math.floor(c / n), x, z, 1); }
  if (xp > 0) { const n = xp >= 30 ? 5 : 1; for (let i = 0; i < n; i++) mkPick('x', i === n - 1 ? xp - Math.floor(xp / n) * (n - 1) : Math.floor(xp / n), x, z, 1); }
}
function mkPick(kind, value, x, z, scale) {
  const a = Math.random() * TAU, sp = rnd(2, 4);
  picks.push({kind, value, x, z, y:.6, vx:Math.cos(a) * sp, vz:Math.sin(a) * sp, vy:rnd(4, 6), ground:false, t:0, life:12, scale, ph:Math.random() * 6});
}
let combo = 0, lastPick = -9;
function updatePicks(dt) {
  for (const p of picks) {
    p.t += dt;
    if (!p.ground) {
      p.vy -= 18 * dt; p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      p.x = Math.max(-HALF.x + 1, Math.min(HALF.x - 1, p.x)); p.z = Math.max(-HALF.z + 1, Math.min(HALF.z - 1, p.z));
      if (p.y <= 0 && p.vy < 0) { p.y = 0; p.ground = true; }
      continue;
    }
    const d = flat(p, hero);
    if (p.kind === 'x') {
      if (p.t > .5) {
        const sp = 8 + (p.t - .5) * 14, dd = Math.max(.001, d); p.x += (hero.x - p.x) / dd * Math.min(dd, sp * dt); p.z += (hero.z - p.z) / dd * Math.min(dd, sp * dt); p.y = .6;
        if (d < .4) { addXp(p.value); sfx('xp', 1.2); p.dead = true; }
      }

    }
    p.life -= dt; if (p.life <= 0) { burst(p.x, p.z, .2, C.gold, 4, .1); p.dead = true; continue; }
    const magnet = 2.6 * p.scale, collect = p.scale + .3;
    if (d < magnet) { const sp = Math.min(d, 10 * dt) / Math.max(d, .001); p.x += (hero.x - p.x) * sp; p.z += (hero.z - p.z) * sp; p.y = 0; }
    else p.y = .08 + .08 * Math.sin(p.t * 4 + p.ph);
    if (d < collect) {
      g.cro += p.value; combo = (g.time - lastPick < .6) ? Math.min(combo + 1, 8) : 0; lastPick = g.time;
      pop(p.x, p.z, 1, '+' + p.value, C.gold, p.value >= 20 ? 26 : 20); burst(p.x, p.z, .3, C.gold, 5, .1, 3); sfx('pick', 1 + combo * .06); p.dead = true;
    }

}
