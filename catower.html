<!DOCTYPE html>
<html lang="fr">
<head>

<body>
<canvas id="c" aria-label="CATOWER"></canvas>
<a class="back" href="jeux.html">← Tous les jeux</a>
<div id="small"><div><b>CATOWER</b> se joue au clavier et à la souris.<br>Ouvre cette page sur un ordinateur.<br><br><a href="jeux.html" style="color:#FF5C93">← Tous les jeux</a></div></div>
<script>
"use strict";
(() => {
const TAU = Math.PI * 2, TILT = 0.9;
const C = {ink:'#4A3553',pink:'#FF8FB4',pinkSoft:'#FFD9E6',gold:'#F4A62A',goldDark:'#B87408',violet:'#7C6BFF',coral:'#F0566E',
  mint:'#CFEFE3',mintDark:'#8FD1B5',grass:'#BDE8D0',road:'#FFE3C7',roadEdge:'#F3C9A0',fur:'#FFB86B',furLight:'#FFE6C4',milk:'#F4F8FF',
  sky:'#FFF3F7',water:'#8FD3FF',lilac:'#C9B8FF',muted:'#7E6A87',goldText:'#C9800A'};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, S = 40, K = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.max(W / 30, H / 17.5); K = H / 720;
}
addEventListener('resize', resize); resize();

// ---------------- Carte ----------------
const HALF = {x: 28, z: 17};
const PATH = [[-27,10],[-12,10],[-12,-8],[4,-8],[4,8],[18,8],[18,-6],[24,-6]].map(p => ({x:p[0], z:p[1]}));
const PADPOS = [[-20,6.5],[-20,13.5],[-8.5,1],[-15.5,1],[-8,-4.5],[-8,-11.5],[0,-4.5],[0.5,0],[7.5,0],[0.5,-11.5],[10,11.5],[10,4.5],[14.5,0],[21.5,0]];
const cum = [0]; for (let i = 1; i < PATH.length; i++) cum.push(cum[i-1] + Math.hypot(PATH[i].x-PATH[i-1].x, PATH[i].z-PATH[i-1].z));
const PLEN = cum[cum.length-1];
function pointAt(d) {
  d = Math.max(0, Math.min(PLEN, d));
  for (let i = 1; i < PATH.length; i++) if (d <= cum[i] || i === PATH.length-1) {
    const a = PATH[i-1], b = PATH[i], l = cum[i]-cum[i-1], dx = (b.x-a.x)/l, dz = (b.z-a.z)/l, t = d-cum[i-1];
    return {x:a.x+dx*t, z:a.z+dz*t, dx, dz};
  }
}
function distToPath(x, z) {
  let best = 1e9;
  for (let i = 1; i < PATH.length; i++) {
    const a = PATH[i-1], b = PATH[i], abx = b.x-a.x, abz = b.z-a.z;
    const t = Math.max(0, Math.min(1, ((x-a.x)*abx + (z-a.z)*abz) / (abx*abx + abz*abz)));
    best = Math.min(best, Math.hypot(x-(a.x+abx*t), z-(a.z+abz*t)));
  }
  return best;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const DECOR = (() => {
  const r = rng(7), list = [];
  for (let i = 0; i < 110; i++) {
    const x = (r()*2-1)*(HALF.x+3), z = (r()*2-1)*(HALF.z+3);
    if (distToPath(x, z) < 3.2 || PADPOS.some(p => Math.hypot(p[0]-x, p[1]-z) < 2.6)) continue;
    list.push({x, z, k: Math.floor(r()*4), c: r() < .5});
  }
  return list.sort((a, b) => a.z - b.z);
})();

// ---------------- Données ----------------
const ENEMIES = {
  mouse:   {id:'mouse',   name:'Souris',           hp:30,   speed:2.6, scale:1.0, r:.55, core:1,  cro:5,   xp:2},
  sparrow: {id:'sparrow', name:'Moineau',          hp:18,   speed:4.6, scale:.9,  r:.5,  core:1,  cro:4,   xp:2},
  turtle:  {id:'turtle',  name:'Tortue',           hp:140,  speed:1.5, scale:1.2, r:.8,  core:2,  cro:12,  xp:4},
  ratchef: {id:'ratchef', name:'Gros Rat Chef',    hp:900,  speed:1.6, scale:1.7, r:1.1, core:5,  cro:80,  xp:40,  boss:true},
  vacuum:  {id:'vacuum',  name:'Robot-aspirateur', hp:3200, speed:1.3, scale:2.3, r:1.7, core:12, cro:200, xp:100, boss:true},
};
const st = (o) => Object.assign({damage:0, range:0, cooldown:1, splash:0, slowMul:1, slowTime:0, dps:0, ramp:0, speed:16, beams:1, pierce:false, freeze:false}, o);
const U = (name, desc, cost, fn) => ({name, desc, cost, fn});
const TOWERS = [
  {id:'cannon', name:'Canon à pelotes', role:'Mono-cible', cost:60, color:C.pink, pathNames:['Rafale','Lourd'],
   stats:st({damage:12, range:8, cooldown:.7}),
   paths:[[
     U('Tir rapide','Cadence +25 %',40,s=>s.cooldown*=.8), U('Ressorts','Cadence +25 %',70,s=>s.cooldown*=.8),
     U('Mitrailleuse','Cadence +40 %, portée +1',140,s=>{s.cooldown*=.7;s.range+=1}),
     U('Turbo-pelote','Cadence +40 %, dégâts +30 %',260,s=>{s.cooldown*=.7;s.damage*=1.3}),
     U('Pelote perforante','Traverse tous les ennemis',700,s=>{s.pierce=true;s.damage*=1.5;s.range+=2})],
    [U('Pelote lourde','Dégâts +60 %',50,s=>s.damage*=1.6), U('Impact','Dégâts de zone',90,s=>s.splash=2),
     U('Gros calibre','Dégâts +60 %, zone plus large',170,s=>{s.damage*=1.6;s.splash+=.8}),
     U('Boule de bowling','Dégâts +60 %, zone plus large',320,s=>{s.damage*=1.6;s.splash+=.8}),
     U('Boulet géant','Dégâts x2.5, énorme zone',800,s=>{s.damage*=2.5;s.splash+=1.5;s.cooldown*=1.3})]]},
  {id:'fountain', name:'Fontaine à lait', role:'Zone, ralentit', cost:110, color:C.water, pathNames:['Gel','Jet'],
   stats:st({damage:4, range:6, cooldown:1.4, slowMul:.6, slowTime:1.5}),
   paths:[[
     U('Lait glacé','Ralentit 50 %',60,s=>s.slowMul=.5), U('Grande flaque','Portée +1.5',100,s=>s.range+=1.5),
     U('Crème collante','Ralentit 65 %, plus longtemps',190,s=>{s.slowMul=.35;s.slowTime=2.5}),
     U('Banquise','Ralentit 75 %, portée +1.5',340,s=>{s.slowMul=.25;s.range+=1.5}),
     U('Lac de lait gelé','Fige les ennemis 1 s',750,s=>{s.freeze=true;s.cooldown*=.8})],
    [U('Pression','Dégâts x2.5',70,s=>s.damage*=2.5), U('Jet rapide','Cadence +40 %',110,s=>s.cooldown*=.7),
     U('Geyser','Dégâts x2.5',200,s=>s.damage*=2.5), U('Tsunami','Dégâts x2, cadence +25 %',360,s=>{s.damage*=2;s.cooldown*=.8}),
     U('Raz-de-marée','Dégâts x3, portée +2',800,s=>{s.damage*=3;s.range+=2})]]},
  {id:'laser', name:'Pointeur laser', role:'Rayon, longue portée', cost:200, color:C.lilac, pathNames:['Faisceaux','Chauffe'],
   stats:st({dps:14, range:11}),
   paths:[[
     U('Lentille','Dégâts +30 %, portée +1.5',100,s=>{s.dps*=1.3;s.range+=1.5}), U('Double lentille','Dégâts +40 %',160,s=>s.dps*=1.4),
     U('Prisme','2 faisceaux',300,s=>s.beams=2), U('Prisme rubis','Dégâts +50 %',520,s=>s.dps*=1.5),
     U('Triple faisceau','3 faisceaux, dégâts +40 %',1100,s=>{s.beams=3;s.dps*=1.4})],
    [U('Surchauffe','Dégâts qui montent sur une même cible',110,s=>s.ramp=.4), U('Cristal chaud','Dégâts +50 %',170,s=>s.dps*=1.5),
     U('Fournaise','Montée en chaleur plus forte',320,s=>s.ramp=.9), U('Soleil','Dégâts +60 %',540,s=>s.dps*=1.6),
     U('Rayon du soleil','Chaleur extrême, portée +2',1100,s=>{s.ramp=1.8;s.dps*=1.5;s.range+=2})]]},
];
const ABIL = [
  {key:'q', label:'Q', name:'Pelote filée', cd:4, lvl:1}, {key:'w', label:'W', name:'Bond de chat', cd:5, lvl:2}, {key:'e', label:'E', name:'Miaou-choc', cd:12, lvl:3},
];
const SEQ_WIN = 3, WAVES = 10, WAVE_GAP = 22, XP_T = [30, 80, 150, 260];

// ---------------- Sons ----------------
let ac = null; const lastSfx = {};
const SFX = {hit:[500,.05,.22,-250],pick:[900,.1,.3,500],xp:[600,.08,.18,300],shoot:[300,.07,.2,400],build:[300,.2,.3,300],upgrade:[500,.3,.3,600],
  splash:[220,.15,.25,-100],core:[110,.35,.4,-60],level:[660,.4,.3,500],e:[180,.3,.35,200],q:[700,.1,.25,-300],w:[400,.12,.25,500],error:[160,.12,.25,-40]};
function sfx(k, pitch = 1) {
  if (!ac) return; const now = ac.currentTime; if (lastSfx[k] && now - lastSfx[k] < .04) return; lastSfx[k] = now;
  const [f, d, v, sl] = SFX[k], o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(f * pitch, now); o.frequency.linearRampToValueAtTime(Math.max(40, (f + sl) * pitch), now + d);
  g.gain.setValueAtTime(v * .5, now); g.gain.exponentialRampToValueAtTime(.001, now + d);
  o.connect(g); g.connect(ac.destination); o.start(now); o.stop(now + d + .02);
}

// ---------------- État ----------------
let g, enemies, towers, projs, picks, parts, rings, floaters, hero, cam, ui = [], mouse = {x:0, y:0, down2:false}, keys = {}, sel, buildIdx, paused = false, shake = 0;
const pads = PADPOS.map(p => ({x:p[0], z:p[1], tower:null}));
function reset() {
  g = {phase:'prep', seq:0, wave:0, cro:150, coreMax:30, coreHp:30, xp:0, lvl:1, banner:'Bienvenue ! Construis un canon (touche 1), puis appuie sur Entrée.', bannerT:6, nextWave:0, time:0, pending:[], pulse:0};
  enemies = []; towers = []; projs = []; picks = []; parts = []; rings = []; floaters = []; sel = null; buildIdx = -1; shake = 0;
  pads.forEach(p => p.tower = null);
  hero = {x:-6, z:2, fx:0, fz:1, mt:null, target:null, atk:0, cd:[0,0,0], dash:0, dvx:0, dvz:0, moving:false, t:0, hit:0};
  cam = {x:-6, z:2};
}
reset();
const flat = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const rnd = (a, b) => a + Math.random() * (b - a);
const banner = (s, t = 3) => { g.banner = s; g.bannerT = t; };
function burst(x, z, y, color, n = 8, size = .12, speed = 4) {
  for (let i = 0; i < n; i++) { const a = Math.random() * TAU, sp = rnd(.4, 1) * speed;
    parts.push({x, z, y, vx:Math.cos(a) * sp, vz:Math.sin(a) * sp * .6, vy:rnd(1, 4), life:rnd(.3, .6), max:.6, size, color}); }
}
function ring(x, z, r, color, life = .35) { rings.push({x, z, r, color, t:0, life}); }
function pop(x, z, y, text, color, size = 20) { floaters.push({x:x + rnd(-.3, .3), z, y, text, color, t:0, life:.9, size}); }

// ---------------- Ennemis ----------------
function spawnEnemy(def, hpScale) {
  enemies.push({def, hp:def.hp * hpScale, max:def.hp * hpScale, d:0, lane:rnd(-.8, .8) * (def.boss ? .2 : 1), slowMul:1, slowT:0, stunT:0, markT:0, flash:0, x:0, z:0, dx:1, dz:0, dead:false, t:Math.random() * 6});
  placeEnemy(enemies[enemies.length - 1]);
}
function placeEnemy(e) { const p = pointAt(e.d); e.dx = p.dx; e.dz = p.dz; e.x = p.x - p.dz * e.lane; e.z = p.z + p.dx * e.lane; }
function inRange(x, z, r) { return enemies.filter(e => !e.dead && Math.hypot(e.x - x, e.z - z) <= r + e.def.r); }
function hitEnemy(e, dmg, fromTower, showNum = true) {
  if (e.dead) return;
  if (fromTower && e.markT > 0) dmg *= 1.25;
  e.hp -= dmg; e.flash = 1;
  if (showNum) { pop(e.x, e.z, e.def.r * 2.2, String(Math.round(dmg)), e.markT > 0 ? C.violet : '#fff'); sfx('hit', rnd(.9, 1.15)); }
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  e.dead = true; burst(e.x, e.z, .6, C.coral, e.def.boss ? 24 : 8, e.def.boss ? .3 : .15, e.def.boss ? 7 : 4);
  drop(e.x, e.z, e.def.cro, e.def.xp, !!e.def.boss);
  if (e.def.boss) { shake = .5; banner(e.def.name + ' vaincu !'); }
}
function slow(e, mul, t) { if (mul <= e.slowMul || e.slowT <= 0) { e.slowMul = mul; e.slowT = Math.max(e.slowT, t); } }

// ---------------- Croquettes / XP ----------------
function drop(x, z, cro, xp, big) {
  let c = cro;
  if (big && c > 0) { const b = Math.round(c * .6); mkPick('c', b, x, z, 1.8); c -= b; }
  if (c > 0) { const n = Math.max(1, Math.min(big ? 5 : 4, Math.ceil(c / 5))); for (let i = 0; i < n; i++) mkPick('c', i === n - 1 ? c - Math.floor(c / n) * (n - 1) : Math.floor(c / n), x, z, 1); }
  if (xp > 0) { const n = xp >= 30 ? 5 : 1; for (let i = 0; i < n; i++) mkPick('x', i === n - 1 ? xp - Math.floor(xp / n) * (n - 1) : Math.floor(xp / n), x, z, 1); }
}
function mkPick(kind, value, x, z, scale) {
  const a = Math.random() * TAU, sp = rnd(2, 4);
  picks.push({kind, value, x, z, y:.6, vx:Math.cos(a) * sp, vz:Math.sin(a) * sp, vy:rnd(4, 6), ground:false, t:0, life:12, scale, ph:Math.random() * 6});
}
let combo = 0, lastPick = -9;
function updatePicks(dt) {
  for (const p of picks) {
    p.t += dt;
    if (!p.ground) {
      p.vy -= 18 * dt; p.x += p.vx * dt; p.z += p.vz * dt; p.y += p.vy * dt;
      p.x = Math.max(-HALF.x + 1, Math.min(HALF.x - 1, p.x)); p.z = Math.max(-HALF.z + 1, Math.min(HALF.z - 1, p.z));
      if (p.y <= 0 && p.vy < 0) { p.y = 0; p.ground = true; }
      continue;
    }
    const d = flat(p, hero);
    if (p.kind === 'x') {
      if (p.t > .5) {
        const sp = 8 + (p.t - .5) * 14, dd = Math.max(.001, d); p.x += (hero.x - p.x) / dd * Math.min(dd, sp * dt); p.z += (hero.z - p.z) / dd * Math.min(dd, sp * dt); p.y = .6;
        if (d < .4) { addXp(p.value); sfx('xp', 1.2); p.dead = true; }
      }
      continue;
    }
    p.life -= dt; if (p.life <= 0) { burst(p.x, p.z, .2, C.gold, 4, .1); p.dead = true; continue; }
    const magnet = 2.6 * p.scale, collect = p.scale + .3;
    if (d < magnet) { const sp = Math.min(d, 10 * dt) / Math.max(d, .001); p.x += (hero.x - p.x) * sp; p.z += (hero.z - p.z) * sp; p.y = 0; }
    else p.y = .08 + .08 * Math.sin(p.t * 4 + p.ph);
    if (d < collect) {
      g.cro += p.value; combo = (g.time - lastPick < .6) ? Math.min(combo + 1, 8) : 0; lastPick = g.time;
      pop(p.x, p.z, 1, '+' + p.value, C.gold, p.value >= 20 ? 26 : 20); burst(p.x, p.z, .3, C.gold, 5, .1, 3); sfx('pick', 1 + combo * .06); p.dead = true;
    }
  }
  picks = picks.filter(p => !p.dead);
}
function addXp(v) {
  g.xp += v;
  while (g.lvl < 5 && g.xp >= XP_T[g.lvl - 1]) {
    g.lvl++; const a = ABIL.find(a => a.lvl === g.lvl);
    banner('Niveau ' + g.lvl + ' !' + (a ? '  ·  ' + a.name + ' débloqué !' : ''));
    sfx('level'); burst(hero.x, hero.z, 1, C.violet, 16, .15, 6); ring(hero.x, hero.z, 4, C.violet, .5);
  }
}

// ---------------- Projectiles ----------------
function mkProj(o) { projs.push(Object.assign({x:0, z:0, y:.9, dx:1, dz:0, speed:14, life:3, damage:0, splash:0, slowMul:1, slowTime:0, markTime:0, size:.35, pierce:false, tower:false, target:null, color:C.pink, hit:new Set()}, o)); }
function updateProjs(dt) {
  for (const p of projs) {
    p.life -= dt; if (p.life <= 0) { p.dead = true; continue; }
    if (p.target && !p.target.dead && !p.pierce) { const d = Math.hypot(p.target.x - p.x, p.target.z - p.z) || 1; p.dx = (p.target.x - p.x) / d; p.dz = (p.target.z - p.z) / d; }
    p.x += p.dx * p.speed * dt; p.z += p.dz * p.speed * dt;
    for (const e of enemies) {
      if (e.dead || p.hit.has(e)) continue;
      if (Math.hypot(e.x - p.x, e.z - p.z) < e.def.r + p.size * .5) {
        p.hit.add(e); applyProj(p, e);
        if (p.splash > 0) { for (const o of inRange(e.x, e.z, p.splash)) if (o !== e) applyProj(p, o); ring(e.x, e.z, p.splash, p.color); }
        burst(p.x, p.z, p.y, p.color, 6, .1, 3.5);
        if (!p.pierce) { p.dead = true; break; }
      }
    }
  }
  projs = projs.filter(p => !p.dead);
}
function applyProj(p, e) { hitEnemy(e, p.damage, p.tower); if (p.slowTime > 0) slow(e, p.slowMul, p.slowTime); if (p.markTime > 0) e.markT = Math.max(e.markT, p.markTime); }

// ---------------- Tourelles ----------------
function buildTower(def, pad) {
  const t = {def, s:Object.assign({}, def.stats), pad, x:pad.x, z:pad.z, tiers:[0, 0], invested:def.cost, boost:0, cd:0, ang:0, focus:null, focusT:0, beams:[]};
  pad.tower = t; towers.push(t); burst(t.x, t.z, .5, def.color, 12, .15, 4); ring(t.x, t.z, 2.2, def.color); sfx('build'); return t;
}
function canUpgrade(t, p) {
  if (t.tiers[p] >= 5) return 'Maximum atteint';
  if (t.tiers[p] + 1 > 2 && t.tiers[1 - p] > 2) return "Verrouillé : l'autre branche est trop avancée";
  return '';
}
function upgrade(t, p) {
  const why = canUpgrade(t, p); if (why) { banner(why, 2); sfx('error'); return; }
  const step = t.def.paths[p][t.tiers[p]];
  if (g.cro < step.cost) { banner('Pas assez de croquettes', 1.5); sfx('error'); return; }
  g.cro -= step.cost; t.invested += step.cost; step.fn(t.s); t.tiers[p]++;
  burst(t.x, t.z, 1.5, p === 0 ? C.pink : C.mintDark, 14, .13, 5); ring(t.x, t.z, 2.5, C.gold); sfx('upgrade', 1 + .1 * (t.tiers[0] + t.tiers[1]));
  if (t.tiers[p] === 5) banner('Amélioration ultime : ' + step.name + ' !');
}
function sellTower(t) {
  const v = Math.round(t.invested * .7); g.cro += v; pop(t.x, t.z, 2, '+' + v, C.gold); burst(t.x, t.z, 1, t.def.color, 10, .13);
  t.pad.tower = null; towers = towers.filter(o => o !== t); if (sel === t) sel = null; sfx('build', .7);
}
function pickTarget(t, range) { let best = null; for (const e of enemies) if (!e.dead && Math.hypot(e.x - t.x, e.z - t.z) <= range + e.def.r && (!best || e.d > best.d)) best = e; return best; }
function updateTowers(dt) {
  for (const t of towers) {
    const b = t.boost > 0 ? 1.35 : 1; if (t.boost > 0) t.boost -= dt; const s = t.s, k = t.def.id;
