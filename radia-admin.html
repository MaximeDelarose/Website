<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f6e9f4">
  <title>RADIA · Tableau de bord privé</title>
  <style>
    :root { --bg:#f6e9f4; --card:#ffffff; --ink:#3d2b45; --soft:#7c6a86; --rose:#e8558f; --rose2:#ffd6e6; --line:#ecd9ea; --ok:#3fae72; --warn:#c0842b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#241a2b; --card:#33263b; --ink:#f4e8f2; --soft:#bba8c4; --line:#4a3a55; --rose2:#4d2a3c; } }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; padding:max(16px, env(safe-area-inset-top)) 16px 40px; }
    main { max-width:640px; margin:0 auto; }
    h1 { font-size:22px; margin:6px 0 2px; } h2 { font-size:17px; margin:0; }
    .sub { color:var(--soft); font-size:14px; margin:0 0 14px; }
    .card { background:var(--card); border-radius:18px; padding:14px; margin:0 0 14px; box-shadow:0 2px 10px rgba(120,60,120,.12); }
    .row { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12.5px; font-weight:700; background:var(--rose2); color:var(--rose); }
    .badge.ok { background:#dff5e8; color:var(--ok); } .badge.off { background:#f1e6d2; color:var(--warn); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
    .kpi { background:var(--bg); border-radius:14px; padding:10px 12px; } .kpi b { display:block; font-size:19px; } .kpi span { font-size:12.5px; color:var(--soft); }
    .kpi.wide { grid-column:1 / -1; }
    .bars { display:flex; align-items:flex-end; gap:4px; height:64px; margin:10px 0 2px; } .bars i { flex:1; background:var(--rose); border-radius:5px 5px 2px 2px; min-height:2px; opacity:.85; }
    .bars-l { display:flex; gap:4px; font-size:10px; color:var(--soft); } .bars-l span { flex:1; text-align:center; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; } th, td { text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); } th { color:var(--soft); font-weight:600; font-size:12.5px; }
    button { font:inherit; border:0; border-radius:12px; padding:10px 14px; background:var(--rose); color:#fff; font-weight:700; min-height:44px; cursor:pointer; }
    button.sec { background:var(--rose2); color:var(--rose); } button.small { min-height:36px; padding:6px 12px; font-size:14px; }
    .note { font-size:12.5px; color:var(--soft); margin-top:10px; } .err { color:#c0392b; font-weight:600; }
    details summary { cursor:pointer; color:var(--rose); font-weight:700; padding:6px 0; min-height:36px; }
  </style>
</head>
<body>
<main>
  <h1>RADIA ♡ · Tableau de bord privé</h1>
  <p class="sub" id="sub">Statistiques de jeu partagées avec le consentement de la joueuse.</p>
  <div id="app"><div class="card">Chargement…</div></div>
</main>
<script src="js/data.js?v=20261103re4"></script>
<script src="js/auth.js?v=20261103re4"></script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var TZ = "Europe/Paris";
  function el(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "text") e.textContent = attrs[k]; else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return e;
  }
  function fmtDur(s) { s = Math.max(0, Math.round(s || 0)); if (s < 60) return s + " s"; var m = Math.round(s / 60); if (m < 60) return m + " min"; return Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0"); }
  function fmtDate(iso) { if (!iso) return "—"; var d = new Date(iso); if (isNaN(d)) return "—"; return d.toLocaleString("fr-FR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
  function ago(iso, now) { if (!iso) return ""; var s = Math.max(0, (new Date(now) - new Date(iso)) / 1000); if (s < 90) return "à l’instant"; var m = Math.round(s / 60); if (m < 60) return "il y a " + m + " min"; var h = Math.round(m / 60); if (h < 36) return "il y a " + h + " h"; return "il y a " + Math.round(h / 24) + " j"; }
  function state(x) { if (x.live) return { t: "en cours", c: "ok" }; if (x.ended_at && (x.end_reason === "closed" || x.end_reason === "background")) return { t: "terminée", c: "" }; return { t: "fin estimée", c: "off" }; }
  var PLAT = { pwa: "Application installée", safari: "Safari (navigateur)", other: "Autre navigateur" };

  function kpi(label, value, extra, wide) { return el("div", { class: "kpi" + (wide ? " wide" : "") }, el("b", { text: value }), el("span", { text: label + (extra ? " · " + extra : "") })); }

  function deviceCard(d, now, reload) {
    var title = d.label || ("Appareil " + d.short);
    var paused = !!d.paused_at;
    var head = el("div", { class: "row" }, el("h2", { text: title }),
      el("span", { class: "badge " + (paused ? "off" : "ok"), text: paused ? "Partage désactivé" : "Partage actif" }));
    var ls = d.last_session;
    var grid = el("div", { class: "grid" },
      kpi("Dernière ouverture", fmtDate(d.last_open), ago(d.last_open, now), true),
      kpi("Dernière activité", fmtDate(d.last_seen), ago(d.last_seen, now), true),
      kpi("Durée active · dernière session", ls ? fmtDur(ls.active_s) : "—", ls ? state(ls).t : ""),
      kpi("Sessions aujourd’hui", String(d.sessions_today || 0)),
      kpi("Temps de jeu aujourd’hui", fmtDur(d.today_s)),
      kpi("Temps de jeu cette semaine", fmtDur(d.week_s)),
      kpi("Depuis le premier lancement", fmtDur(d.total_s), (d.sessions_total || 0) + " sessions", true));
    // 14 derniers jours
    var days = (d.days || []).slice().reverse(); var max = 1; days.forEach(function (x) { if (x.active_s > max) max = x.active_s; });
    var bars = el("div", { class: "bars", role: "img", "aria-label": "Temps de jeu des derniers jours" }); var lab = el("div", { class: "bars-l" });
    days.forEach(function (x) { var i = el("i", { title: x.day + " : " + fmtDur(x.active_s) + " · " + x.sessions + " session(s)" }); i.style.height = Math.max(3, Math.round(x.active_s / max * 100)) + "%"; bars.appendChild(i); lab.appendChild(el("span", { text: x.day.slice(8) })); });
    // historique
    var rows = (d.sessions || []).map(function (s) { var st = state(s); return el("tr", null, el("td", { text: fmtDate(s.started_at) }), el("td", { text: fmtDur(s.active_s) }), el("td", null, el("span", { class: "badge " + st.c, text: st.t }))); });
    var table = el("table", null, el("thead", null, el("tr", null, el("th", { text: "Début" }), el("th", { text: "Actif" }), el("th", { text: "Fin" }))), el("tbody", null, rows.length ? rows : [el("tr", null, el("td", { text: "Aucune session", colspan: "3" }))]));
    var det = el("details", null, el("summary", { text: "Historique des sessions (30 dernières)" }), table);
    var actions = el("div", { class: "row", style: "margin-top:12px" },
      (function () { var b = el("button", { class: "sec small", text: "Renommer" }); b.onclick = function () { var n = prompt("Nom de cet appareil (ex. « iPhone de Radia »)", d.label || ""); if (n === null) return; SiteAuth.rpc("radia_stats_admin_label", { p_device: d.id, p_label: n }).then(reload, fail); }; return b; })(),
      (function () { var b = el("button", { class: "sec small", text: "Supprimer ses données" }); b.onclick = function () { if (!confirm("Supprimer définitivement toutes les statistiques de cet appareil ?")) return; SiteAuth.client().then(function (c) { return c.auth.getSession(); }).then(function (r) { var t = r && r.data && r.data.session && r.data.session.access_token; return fetch(window.SITE.supabase.url + "/functions/v1/radia-push", { method: "POST", headers: { "Content-Type": "application/json", apikey: window.SITE.supabase.key, Authorization: "Bearer " + t }, body: JSON.stringify({ action: "stats-admin-delete", device: d.id }) }); }).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error || "delete"); reload(); }).catch(fail); }; return b; })());
    var meta = el("p", { class: "note", text: PLAT[d.platform] + " · consentement le " + fmtDate(d.consent_at) + (paused ? " · désactivé le " + fmtDate(d.paused_at) : "") + " · fuseau " + d.tz });
    return el("section", { class: "card" }, head, meta, grid, el("b", { text: "14 derniers jours" }), bars, lab, det, actions);
  }

  function fail(e) { app.replaceChildren(el("div", { class: "card" }, el("p", { class: "err", text: (e && e.message === "not_admin") ? "Accès refusé : ce compte n’est pas autorisé à consulter ces statistiques." : "Impossible de charger les données pour l’instant. Réessaie dans un moment." }), signOutBtn())); }
  function signOutBtn() { var b = el("button", { class: "sec small", text: "Se déconnecter" }); b.onclick = function () { SiteAuth.signOut().then(function () { location.reload(); }); }; return b; }

  var timer = 0;
  function load() {
    SiteAuth.rpc("radia_stats_admin").then(function (data) {
      var now = data.now; var list = data.devices || [];
      var out = [];
      if (!list.length) out.push(el("div", { class: "card" }, el("p", { text: "Aucune joueuse n’a encore accepté de partager ses statistiques." }), el("p", { class: "note", text: "Rien n’est enregistré tant que Radia n’a pas accepté dans RADIA → Réglages → Statistiques de jeu (ou via l’invitation affichée une seule fois)." })));
      list.forEach(function (d) { out.push(deviceCard(d, now, load)); });
      var bar = el("div", { class: "row" }, (function () { var b = el("button", { class: "small", text: "Actualiser" }); b.onclick = load; return b; })(), signOutBtn());
      var r = data.retention || {};
      out.push(bar, el("p", { class: "note", text: "Le temps de jeu est une ESTIMATION de l’activité réelle (jeu ouvert et écran touché dans la dernière minute) ; l’heure d’une session « fin estimée » est la dernière activité connue : sur iPhone, la fermeture brutale d’une application n’est pas détectable. Conservation : détail des sessions " + (r.sessions_days || 90) + " j, totaux par jour " + (r.days_days || 400) + " j, appareil inactif " + (r.idle_device_days || 180) + " j. Heures affichées en Europe/Paris." }));
      app.replaceChildren.apply(app, out);
      document.getElementById("sub").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }) + " — statistiques partagées avec le consentement de la joueuse.";
      clearTimeout(timer); timer = setTimeout(function () { if (!document.hidden) load(); else timer = setTimeout(load, 60000); }, 60000);
    }, fail);
  }

  function showLogin() {
    var b = el("button", { text: "Se connecter avec Google" }); b.onclick = function () { SiteAuth.signIn(); };
    app.replaceChildren(el("div", { class: "card" }, el("p", { text: "Espace réservé au créateur du jeu." }), b));
  }
  SiteAuth.ready.then(function (s) { if (s && s.user) load(); else showLogin(); });
})();
</script>
</body>
</html>
