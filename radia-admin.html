    function row(label, v, t) { return el("div", null, el("p", { text: label + " : " + v + (t ? " / " + t : "") }), t ? gauge(Math.round(v / t * 100), label) : null); }
    return sect("🌍", "Mon Monde", [
      el("p", { class: "big", text: "Progression générale : " + w.pct + " %" }), gauge(w.pct, "Mon Monde"),
      el("p", { class: "note", text: "Calculée uniquement sur des objectifs finis : pièces du château, tenues et meubles. Les activités sans objectif final (jardin, chat, famille…) n’ont pas de pourcentage." }),
      row("Pièces débloquées", w.rooms, w.roomsTotal), row("Meubles et décorations obtenus", w.furniture, w.furnitureTotal), row("Tenues obtenues", w.wardrobe, w.wardrobeTotal),
      el("div", { class: "grid" }, kpi("Parcelles du jardin", fmtN(w.gardenPlots)), kpi("Recettes de chocolat", fmtN(w.chocRecipes)), kpi("Niveau de la chocolaterie", fmtN(w.chocShop)), kpi("Métiers découverts", fmtN(w.careers)), kpi("Chat adopté", w.cat ? "Oui" : "Non"), kpi("Enfants avec un lien", fmtN(w.family)))]);
  }
  function modesCard(p) {
    var rows = (p && p.modes) || [];
    if (!rows.length) return sect("⏱️", "Temps actif par mode de jeu", unavailable("Pas encore de temps par mode enregistré."));
    var tot = {}, ses = {}, all = 0; rows.forEach(function (r) { tot[r.mode] = (tot[r.mode] || 0) + r.active_s; ses[r.mode] = (ses[r.mode] || 0) + r.sessions; all += r.active_s; });
    var keys = Object.keys(MODE_NAMES).filter(function (k) { return tot[k] || ses[k]; }).sort(function (a, b) { return (tot[b] || 0) - (tot[a] || 0); });
    var stack = el("div", { class: "stack", role: "img", "aria-label": "Répartition du temps actif par mode" });
    keys.forEach(function (k) { if (!tot[k]) return; var seg = el("i", { title: MODE_NAMES[k] + " : " + fmtDur(tot[k]) }); seg.style.width = (tot[k] / Math.max(1, all) * 100) + "%"; seg.style.background = MODE_COL[k]; stack.appendChild(seg); });
    var tb = el("tbody"); keys.forEach(function (k) { var dot = el("span", { class: "dot" }); dot.style.background = MODE_COL[k]; tb.appendChild(el("tr", null, el("td", null, dot, document.createTextNode(" " + MODE_NAMES[k])), el("td", { text: fmtDur(tot[k] || 0) }), el("td", { text: all ? Math.round((tot[k] || 0) / all * 100) + " %" : "—" }), el("td", { text: String(ses[k] || 0) }))); });
    return sect("⏱️", "Temps actif par mode de jeu", [stack, el("table", null, el("thead", null, el("tr", null, el("th", { text: "Mode" }), el("th", { text: "Temps" }), el("th", { text: "Part" }), el("th", { text: "Sessions" }))), tb),
      el("p", { class: "note", text: "60 derniers jours · estimation du temps ACTIF (jeu visible et écran touché) ; rien n’est compté en arrière-plan." })]);
  }
  function evolutionCard(p, d) {
    var span = 7; var host = el("div");
    function draw() {
      var days = lastDays(span), labels = days;
      var time = days.map(function (k) { var s = 0; ((p && p.modes) || []).forEach(function (r) { if (r.day === k) s += r.active_s; }); return Math.round(s / 60); });
      var sess = days.map(function (k) { var c = 0; ((p && p.sessions) || []).forEach(function (s) { if (dayKey(s.started_at) === k) c++; }); return c; });
      var lvls = days.map(function (k) { var c = 0; ((p && p.events) || []).forEach(function (e) { if (e.kind === "level_done" && dayKey(e.at) === k) c++; }); return c; });
      var ords = days.map(function (k) { var c = 0; ((p && p.sessions) || []).forEach(function (s) { if (dayKey(s.started_at) === k && s.summary && s.summary.now && s.summary.base) c += Math.max(0, n(s.summary.now.orders) - n(s.summary.base.orders)); }); return c; });
      function sum(a) { return a.reduce(function (x, y) { return x + y; }, 0); }
      host.textContent = "";
      host.appendChild(el("div", { class: "grid" }, kpi("Temps actif (" + span + " j)", fmtDur(sum(time) * 60)), kpi("Sessions", String(sum(sess))), kpi("Niveaux terminés", String(sum(lvls))), kpi("Commandes livrées", String(sum(ords)))));
      host.appendChild(miniBars(time, labels, "Temps de jeu par jour (min)", function (v) { return v + " min"; }));
      host.appendChild(miniBars(sess, labels, "Sessions par jour"));
      host.appendChild(miniBars(lvls, labels, "Niveaux terminés par jour"));
      host.appendChild(miniBars(ords, labels, "Commandes livrées par jour"));
    }
    var b7 = btn("7 jours", function () { span = 7; draw(); }, true), b30 = btn("30 jours", function () { span = 30; draw(); }, true);
    draw();
    return sect("📈", "Évolution dans le temps", [el("div", { class: "row", style: "margin-bottom:6px" }, [b7, b30]), host, el("p", { class: "note", text: "Basé uniquement sur les événements réellement enregistrés depuis l’activation du partage de la progression." })]);
  }
  function historyCard(p) {
    var ev = (p && p.events) || [];
    var ul = el("ul", { class: "evlist" });
    ev.slice(0, 40).forEach(function (e) { ul.appendChild(el("li", null, el("span", { text: (EVT_ICON[e.kind] || "•") + " " + e.label }), el("small", { text: fmtDate(e.at) }))); });
    return sect("🗺️", "Historique des chapitres", ev.length ? ul : unavailable("Aucun jalon enregistré pour l’instant : seuls les jalons atteints après l’activation du partage sont conservés (rien n’est reconstitué)."));
  }
  function sessionsHistory(p, d) {
    var list = (p && p.sessions) || [];
    var wrap = el("div");
    if (!list.length) {
      var rows = (d.sessions || []).map(function (s) { var st = state(s); return el("tr", null, el("td", { text: fmtDate(s.started_at) }), el("td", { text: fmtDur(s.active_s) }), el("td", null, el("span", { class: "badge " + st.c, text: st.t }))); });
      wrap.appendChild(el("p", { class: "note", text: "Pas de résumé d’activité : seul le temps de jeu est disponible pour ces sessions." }));
      wrap.appendChild(el("table", null, el("thead", null, el("tr", null, el("th", { text: "Début" }), el("th", { text: "Actif" }), el("th", { text: "Fin" }))), el("tbody", null, rows.length ? rows : [el("tr", null, el("td", { text: "Aucune session enregistrée.", colspan: "3" }))])));
      return sect("🗂️", "Historique des sessions", wrap);
    }
    list.slice(0, 30).forEach(function (s) {
      var det = sessionDetail(s); det.style.display = "none";
      var L = actLines(s.summary);
      var head = el("button", { class: "srow", "aria-expanded": "false" }, el("span", { text: fmtDate(s.started_at) }), el("small", { text: fmtDur(s.active_s) + (L.length ? " · " + L[0].replace(/\.$/, "") : "") }));
      head.onclick = function () { var open = det.style.display === "none"; det.style.display = open ? "" : "none"; head.setAttribute("aria-expanded", open ? "true" : "false"); };
      wrap.appendChild(head); wrap.appendChild(det);
    });
    return sect("🗂️", "Historique des sessions (touche une session)", wrap);
  }

  function deviceCard(d, p, now) {
    var title = d.label || ("Appareil " + d.short);
    var paused = !!d.paused_at;
    var timeOk = !paused;
    var progOk = !!(p && p.ok && p.consent);
    var out = [];
    var head = el("div", { class: "row" }, el("h2", { text: title }),
      el("span", null, el("span", { class: "badge " + (timeOk ? "ok" : "off"), text: timeOk ? "Temps partagé" : "Temps non partagé" }), document.createTextNode(" "), el("span", { class: "badge " + (progOk ? "ok" : "off"), text: progOk ? "Progression partagée" : "Progression non partagée" })));
    var ls = d.last_session;
    // 1 et 2 : dernière connexion / activité, temps de jeu et sessions
    var grid = el("div", { class: "grid" },
      kpi("Dernière ouverture", fmtDate(d.last_open), ago(d.last_open, now)),
      kpi("Dernière activité", fmtDate(d.last_seen), ago(d.last_seen, now)),
      kpi("Durée active · dernière session", ls ? fmtDur(ls.active_s) : "—", ls ? state(ls).t : ""),
      kpi("Sessions aujourd’hui", String(d.sessions_today || 0)),
      kpi("Temps de jeu aujourd’hui", fmtDur(d.today_s)),
      kpi("Temps de jeu cette semaine", fmtDur(d.week_s)),
      kpi("Depuis le premier lancement", fmtDur(d.total_s), (d.sessions_total || 0) + " sessions", true));
    var meta = el("p", { class: "note", text: PLAT[d.platform] + " · fuseau " + d.tz + (timeOk ? " · temps partagé depuis le " + fmtDate(d.consent_at) : " · partage du temps désactivé") + (progOk ? " · progression partagée depuis le " + fmtDate(p.consent_at) : p && p.paused_at ? " · progression arrêtée le " + fmtDate(p.paused_at) : " · progression jamais partagée") });
    out.push(el("section", { class: "card" }, head, meta, grid));
    if (!progOk) out.push(el("section", { class: "card" }, el("p", { text: "La joueuse n’a pas activé « Partager ma progression de jeu ♡ » : aucune donnée de progression n’est disponible (et aucune n’est collectée)." }), el("p", { class: "note", text: "L’option se trouve dans les Réglages de RADIA, séparément du partage du temps de jeu." })));
    out.push(storyCard(progOk ? p : null)); out.push(xpCard(progOk ? p : null)); out.push(lastSessionCard(progOk ? p : null)); out.push(freeCard(progOk ? p : null));
    out.push(pimbCard(progOk ? p : null)); out.push(worldCard(progOk ? p : null)); out.push(modesCard(progOk ? p : null)); out.push(evolutionCard(progOk ? p : null, d)); out.push(historyCard(progOk ? p : null)); out.push(sessionsHistory(progOk ? p : null, d));
    var actions = el("div", { class: "row", style: "margin:0 0 14px" },
      (function () { var b = el("button", { class: "sec small", text: "Renommer" }); b.onclick = function () { var nm = prompt("Nom de cet appareil (ex. « iPhone de Radia »)", d.label || ""); if (nm === null) return; window.__labelDevice(d.id, nm, function () { boot(); }); }; return b; })(),
      (function () { var b = el("button", { class: "sec small", text: "Supprimer ses données" }); b.onclick = function () { if (!confirm("Supprimer définitivement toutes les données de cet appareil (temps de jeu et progression) ?")) return; window.__deleteDevice(d.id, function () { boot(); }); }; return b; })());
    out.push(actions);
    return out;
  }

  function load(c) {
    note("Chargement des statistiques…");
    return withTimeout(c.rpc("radia_stats_admin"), 15000, "stats").then(function (res) {
      if (res.error) { var m = res.error.message || ""; if (/not_admin/.test(m) || res.error.code === "P0001" || res.error.code === "42501") { var e = new Error("not_admin"); e.denied = true; throw e; } var e2 = new Error(m || "erreur"); throw e2; }
      var list = (res.data && res.data.devices) || [];
      note("Chargement de la progression…");
      return Promise.all(list.map(function (d) {
        // une erreur de progression n'empêche jamais d'afficher le temps de jeu : message clair à la place
        return withTimeout(c.rpc("radia_progress_admin", { p_device: d.id }), 15000, "progress").then(function (r) { return r.error ? { ok: false, error: String(r.error.message || "indisponible") } : r.data; }, function () { return { ok: false, error: "indisponible" }; });
      })).then(function (progs) { render(res.data, progs, c); });
    });
  }
  function render(data, progs, c) {
    var now = data.now; var list = data.devices || [];
    var out = [];
    if (!list.length) out.push(el("div", { class: "card" }, el("p", { text: "Aucune donnée disponible : aucune joueuse n’a encore accepté de partager ses statistiques." }), el("p", { class: "note", text: "Rien n’est enregistré tant que la joueuse n’a pas accepté dans les Réglages de RADIA." })));
    list.forEach(function (d, i) {
      var p = progs[i];
      if (p && p.ok === false && p.error) out.push(el("p", { class: "err", text: "Progression indisponible pour cet appareil (" + p.error.slice(0, 60) + ")." }));
      deviceCard(d, p, now).forEach(function (x) { out.push(x); });
    });
    var r = data.retention || {};
    out.push(el("div", { class: "row" }, [btn("Actualiser", boot), signOutBtn()]));
    out.push(el("p", { class: "note", text: "Le temps de jeu est une ESTIMATION de l’activité réelle (jeu ouvert et écran touché dans la dernière minute) ; l’heure d’une session « fin estimée » est la dernière activité connue. Conservation : sessions " + (r.sessions_days || 90) + " jours, jalons et temps par mode 400 jours, appareil inactif " + (r.idle_device_days || 180) + " jours. La progression n’est visible que si la joueuse l’a acceptée (option distincte)." }));
    show(out);
    document.getElementById("sub").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }) + " — données partagées avec le consentement de la joueuse.";
  }
  function deleteDevice(id, then) {
    return getClient().auth.getSession().then(function (r) { var t = r && r.data && r.data.session && r.data.session.access_token; return fetch(CFG.url + "/functions/v1/radia-push", { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + t }, body: JSON.stringify({ action: "stats-admin-delete", device: id }) }); }).then(function (r) { return r.json(); }).then(function (j) { if (!j.ok) throw new Error(j.error || "delete"); then(); }).catch(function (e) { problem("Suppression impossible pour l’instant.", String(e && e.message || e)); });
  }
  window.__deleteDevice = deleteDevice;
  function labelDevice(id, n, then) { return getClient().rpc("radia_stats_admin_label", { p_device: id, p_label: n }).then(then, function (e) { problem("Renommage impossible.", String(e && e.message || e)); }); }
  window.__labelDevice = labelDevice;

  var running = 0;
  function boot() {
    var my = ++running;
    show(el("div", { class: "card", id: "boot" }, el("p", { id: "boot-msg", text: "Chargement…" }), el("p", { class: "note", id: "boot-step", text: "Démarrage" })));
    // filet de sécurité : jamais plus de 20 s sur « Chargement… »
    var guard = setTimeout(function () { if (my === running) problem("Le chargement prend trop de temps.", "La connexion ou le service ne répond pas. Réessaie, ou reconnecte-toi.", [btn("Se connecter avec Google", signIn, true)]); }, 20000);
    var done = function () { clearTimeout(guard); };
    var c;
    try { c = getClient(); } catch (e) { done(); return problem("La bibliothèque de connexion n’a pas pu se charger.", "Vérifie ta connexion internet (ou désactive un bloqueur de contenu) puis réessaie."); }
    var q = new URLSearchParams(location.search);
    var step;
    if (q.get("error") || q.get("error_description")) {
      step = Promise.resolve({ oauthError: q.get("error_description") || q.get("error") });
      try { history.replaceState(null, "", location.pathname); } catch (e) { /* ignore */ }
    } else if (q.get("code")) {
      // retour de Google : la bibliothèque échange elle-même le code à son initialisation (un 2e échange manuel le ferait échouer : le code est à usage unique)
      note("Retour de Google : ouverture de la session…");
      step = Promise.resolve({ fromCode: true });
    } else step = Promise.resolve({});
    step.then(function (o) {
      if (o.oauthError) { done(); return loginCard("La connexion Google a échoué : " + o.oauthError); }
      note("Recherche de la session…");
      var had = false; try { had = !!localStorage.getItem(TOKEN_KEY); } catch (e2) { /* ignore */ }
      return withTimeout(c.auth.getSession(), 10000, "session").then(function (r) {
        var s = r && r.data && r.data.session;
        if (o.fromCode) { try { history.replaceState(null, "", location.pathname); } catch (e3) { /* ignore */ } }
        if (!s) { done(); return loginCard(o.fromCode ? "La connexion n’a pas pu être terminée" + (r && r.error ? " (" + String(r.error.message || r.error).slice(0, 80) + ")" : "") + ". Reconnecte-toi avec Google." : had ? "Ta session précédente a expiré : reconnecte-toi avec Google." : undefined); }
        if (s.expires_at && s.expires_at * 1000 < Date.now() + 30000) {
          note("Session expirée : renouvellement…");
          return withTimeout(c.auth.refreshSession(), 12000, "refresh").then(function (rr) { if (!rr || rr.error || !rr.data || !rr.data.session) { done(); return loginCard("Ta session a expiré : reconnecte-toi."); } return load(c).then(done); });
        }
        return load(c).then(done);
      });
    }).catch(function (e) {
      if (my !== running) return; done();
      var msg = String(e && e.message || e);
      if (e && e.denied) return problem("Accès refusé.", "Ce compte Google n’est pas autorisé à consulter ces statistiques (réservé au créateur).", [signOutBtn()]);
      if (e && e.timeout) return problem("Le service ne répond pas.", "Étape : " + msg.replace("timeout:", "") + ". Vérifie ta connexion puis réessaie.");
      if (/code verifier|pkce|invalid_grant|Auth session missing|refresh/i.test(msg)) return loginCard("La connexion n’a pas pu être terminée (" + msg.slice(0, 80) + "). Reconnecte-toi.");
      if (/Failed to fetch|NetworkError|Load failed/i.test(msg)) return problem("Pas de connexion au serveur.", "Vérifie ta connexion internet puis réessaie.");
      problem("Impossible de charger les données.", msg.slice(0, 160));
    });
  }
  window.__adminBoot = boot;
  boot();
})();
