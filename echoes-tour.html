<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Echoes of Aether : Contes d'Aelor · AkarisuMD</title>
  <meta name="description" content="Echoes of Aether, version RPG au tour par tour : Augh, Aka et Gorak explorent les Prairies d'Aelor et affrontent les moutons sur la scène de la forêt, avec des commandes d'action à chaque coup.">
  <meta name="theme-color" content="#2c4f2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/echoes-tour.css?v=1">
</head>
<body>
  <div id="stage">
    <canvas id="cv" width="480" height="270"></canvas>
    <div id="hud" hidden></div>
    <div id="quest" hidden></div>
    <div id="hint" hidden></div>
    <div id="toast" hidden></div>
    <div id="cmd" hidden></div>
    <div id="menu" hidden></div>
    <div id="dialog" hidden><div class="dlg-name"></div><div class="dlg-text"></div><div class="dlg-next">▼</div></div>
    <div id="panel" hidden></div>
    <button id="btn-pause" type="button" aria-label="Menu" hidden>☰</button>
    <div id="touch" hidden>
      <div class="pad">
        <button type="button" data-k="up" aria-label="Haut">▲</button>
        <button type="button" data-k="left" aria-label="Gauche">◀</button>
        <button type="button" data-k="right" aria-label="Droite">▶</button>
        <button type="button" data-k="down" aria-label="Bas">▼</button>
      </div>
      <div class="ab">
        <button type="button" data-k="b" class="tb">B</button>
        <button type="button" data-k="a" class="ta">A</button>
      </div>
    </div>
    <div id="rotate">↻ Tourne ton téléphone en mode paysage</div>
  </div>
  <!-- les sprites et la direction artistique viennent d'Écureuil Survivor -->
  <script src="js/v2/dither-art.js?v=1"></script>
  <script src="js/v2/game-data.js?v=1"></script>
  <script src="js/echoes-tour.js?v=1"></script>
</body>
</html>
